server:
  port: 8088
  address: 0.0.0.0  # 监听所有网络接口，允许局域网访问
  servlet:
    context-path: /api

spring:
  application:
    name: shop

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shopping?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&useLocalTransactionState=true&cacheResultSetMetadata=true&cacheServerConfiguration=true&elideSetAutoCommits=true&maintainTimeStats=false
    username: root
    password: 123456
    # HikariCP连接池配置（性能优化）
    hikari:
      # 连接池名称
      pool-name: ShopHikariCP
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池数量
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接存活最大时间（毫秒）
      idle-timeout: 600000
      # 连接最大存活时间（毫秒）
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 自动提交
      auto-commit: true
      # 连接泄漏检测阈值（毫秒）
      leak-detection-threshold: 60000

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 缓存配置
  cache:
    type: simple
    cache-names: conversationList,totalUnreadCount,conversationUnread,userInfo,conversationInfo,privateUnreadCount,systemUnreadCount
    simple:
      # 缓存过期时间（秒）
      spec: maximumSize=1000,expireAfterWrite=300s

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 禁用二级缓存（避免缓存一致性问题）
    cache-enabled: false
    # 一级缓存范围设置为 STATEMENT 级别（执行完立即清除，避免脏读）
    local-cache-scope: STATEMENT
    # 启用延迟加载
    lazy-loading-enabled: true
    # 积极延迟加载
    aggressive-lazy-loading: false
    # 允许多结果集
    multiple-result-sets-enabled: true
    # 使用列标签
    use-column-label: true
    # 使用生成的键
    use-generated-keys: true
    # 默认执行器类型
    default-executor-type: reuse
    # 默认语句超时时间
    default-statement-timeout: 30
    # 默认获取数据大小
    default-fetch-size: 100
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.shop.entity

# JWT配置
jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 7200 # 2小时，单位：秒
  header: Authorization
  prefix: Bearer

# 文件上传配置
file:
  upload:
    # 基础上传目录
    base-path: D:/javawork2/shop/uploads/
    # 文件大小限制（字节）
    max-size: 5242880  # 5MB
    # 支持的图片格式
    allowed-extensions: jpg,jpeg,png,gif,bmp,webp
    # 访问URL前缀（不包含 context-path，Spring 会自动添加）
    access-url-prefix: /uploads
    # 服务器基础URL（用于生成完整图片URL）
    # 开发环境使用局域网IP，生产环境使用域名
    server-base-url: http://localhost:8088/api

# Redis配置
  # Spring Data Redis配置（用于缓存）
  data:
    redis:
      host: localhost
      port: 6379
      password:             # 如果有密码就填写
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20    # 连接池最大连接数
          max-idle: 10      # 连接池最大空闲连接数
          min-idle: 5       # 连接池最小空闲连接数
          max-wait: 3000ms  # 连接池最大阻塞等待时间

# Redisson配置（用于分布式锁、延迟队列等）
redisson:
  # 单机模式
  single-server-config:
    address: "redis://127.0.0.1:6379"
    password: # 如果有密码就填写
    database: 0
    connection-pool-size: 20
    connection-minimum-idle-size: 5
    idle-connection-timeout: 10000
    timeout: 3000

# 日志配置
logging:
  level:
    com.example.shop: debug
    org.springframework.security: debug
    org.springframework.web: debug
    org.springframework.boot.web: debug
    org.redisson: info  # Redisson日志级别
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
