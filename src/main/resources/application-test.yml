server:
  port: 0

spring:
  application:
    name: shop-test

  # 测试数据库配置 - 使用内存数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shopping?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&useLocalTransactionState=true&cacheResultSetMetadata=true&cacheServerConfiguration=true&elideSetAutoCommits=true&maintainTimeStats=false
    username: root
    password: 123456
    hikari:
      pool-name: TestHikariCP
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      auto-commit: true

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 缓存配置
  cache:
    type: simple
    cache-names: conversationList,totalUnreadCount,conversationUnread,userInfo,conversationInfo
    simple:
      spec: maximumSize=100,expireAfterWrite=60s

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
    multiple-result-sets-enabled: true
    use-column-label: true
    use-generated-keys: true
    default-executor-type: simple
    default-statement-timeout: 30
    default-fetch-size: 100
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.shop.entity

# JWT配置
jwt:
  secret: testSecretKey123456789012345678901234567890
  expiration: 7200
  header: Authorization
  prefix: Bearer

# 文件上传配置
file:
  upload:
    base-path: /tmp/test-uploads/
    max-size: 5242880
    allowed-extensions: jpg,jpeg,png,gif,bmp,webp
    access-url-prefix: /uploads

# 日志配置
logging:
  level:
    com.example.shop: info
    org.springframework.security: warn
    org.springframework.web: warn
    org.mybatis: warn
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"